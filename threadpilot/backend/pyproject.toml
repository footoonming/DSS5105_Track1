[project]
name = "threadpilot-backend"
version = "1.0.0"
description = "ThreadPilot FastAPI and OpenAI backend"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.121,<1",
    "uvicorn>=0.34,<1",
    "openai>=2,<3",
    "python-dotenv>=1,<2",
    "pydantic>=2,<3",
    "httpx>=0.28,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.16,<2",
    "pymysql[rsa]>=1.1,<2",
    "pandas>=2.2,<3",
    "openpyxl>=3.1,<4",
    "pydantic-settings>=2.10,<3",
    "apscheduler>=3.11,<4",
    "python-multipart>=0.0.20",
    "pyyaml>=6,<7",
    "sqlglot>=27,<29",
    "langchain>=1.0,<2",
    "langchain-community>=0.4,<0.5",
    "langchain-openai>=1.0,<2",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]

[tool.uv]
package = false
