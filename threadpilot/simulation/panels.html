<aside class="side" id="actionPanel" aria-label="Follow-up actions" hidden>
  <header class="side-h"><div><strong id="apTitle">Follow-up actions</strong><small id="apSub"></small></div>
    <button class="btn sm ghost" id="apClose" aria-label="Close follow-up actions">&#10005;</button></header>
  <div class="side-b" id="apBody"></div>
</aside>
<div class="modal" id="settingsModal" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="stTitle">
    <header><h2 id="stTitle">Settings</h2><p class="muted" style="margin-top:4px">Saved in this browser only.</p></header>
    <div class="body" id="stBody"></div>
    <footer><button class="btn primary" id="stDone">Done</button></footer>
  </div>
</div>
<div class="modal" id="memoModal" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="mmTitle">
    <header><h2 id="mmTitle">Add a memo</h2><p class="muted" style="margin-top:4px">Records an amended delivery date or specification. It does not change the factory's order data.</p></header>
    <div class="body" id="mmBody"></div>
    <footer><button class="btn" id="mmCancel">Cancel</button><button class="btn primary" id="mmSave">Save memo</button></footer>
  </div>
</div>
